apiVersion: apps/v1
kind: Deployment
metadata:
  name: sts-app-deployment
  labels:
    app: sts-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sts-app
  template:
    metadata:
      labels:
        app: sts-app
    spec:
      containers:
        - name: sts-app
          image: akshayreddy1155/simple-time-service:v1.0.1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sts-app-nodeport-service
  labels:
    app: sts-app
spec:
  type: NodePort
  selector:
    app: sts-app
  ports:
    - port: 80
      targetPort: 80

