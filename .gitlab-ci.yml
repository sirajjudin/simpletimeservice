workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'  # Only run if manually triggered via UI
stages:
  - docker_build_and_push
  - terraform_plan
  # - terraform_apply

variables:
  IMAGE_TAG: $CI_PIPELINE_ID
  DOCKER_IMAGE: "akshayreddy1155/simple-time-service"
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2

docker_build_and_push_job:
  stage: docker_build_and_push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Building image $DOCKER_IMAGE:$IMAGE_TAG from ./app"
    # - docker build -t $DOCKER_IMAGE:$IMAGE_TAG ./app
    # - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    # - docker push $DOCKER_IMAGE:$IMAGE_TAG
  only:
    - main

terraform_plan:
  stage: terraform_plan
  image:
    name: hashicorp/terraform:1.7.8
    entrypoint: [""]
  needs:
    - job: docker_build_and_push_job
      artifacts: false
  before_script:
    # Export AWS creds for backend / provider if provided
    - |
      if [ -n "$AWS_ACCESS_KEY_ID" ]; then
        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
        export AWS_DEFAULT_REGION="${AWS_REGION:-ap-south-1}"
      fi
    # write kubeconfig if provided (optional)
    - |
      if [ -n "$KUBE_CONFIG_DATA" ]; then
        mkdir -p $CI_PROJECT_DIR
        echo "$KUBE_CONFIG_DATA" | base64 -d > $CI_PROJECT_DIR/kubeconfig
        export KUBECONFIG=$CI_PROJECT_DIR/kubeconfig
      fi
  script:
    - cd terraform
    - terraform init -input=false -upgrade
    # pass the built image into terraform as var "deploy_image"
    - terraform plan -input=false -out=plan.tfplan -var "deploy_image=${DOCKER_IMAGE}:${IMAGE_TAG}"
  artifacts:
    paths:
      - terraform/plan.tfplan
    expire_in: 1h