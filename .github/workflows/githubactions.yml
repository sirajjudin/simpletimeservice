name: CI/CD Pipeline

on:
  workflow_dispatch:  # equivalent to: rules: if: $CI_PIPELINE_SOURCE == "web"

env:
  DOCKER_IMAGE: "${{ vars.DOCKER_USERNAME }}/simple-time-service"
  # IMAGE_TAG will be set per-run via a unique value (run ID)

jobs:
  # -----------------------
  # Docker build and push
  # -----------------------
  docker_build_and_push_job:
    name: docker_build_and_push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # equivalent to: only: [main]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.run_id }}
          # Optional: also tag as latest on main
          # tags: |
          #   ${{ env.DOCKER_IMAGE }}:${{ github.run_id }}
          #   ${{ env.DOCKER_IMAGE }}:latest

      - name: Export image tag for downstream jobs
        run: |
          echo "IMAGE_TAG=${{ github.run_id }}" >> "$GITHUB_ENV"

  # -----------------------
  # Image vulnerability scan (Trivy)
  # -----------------------
  trivy_scan:
    name: trivy_scan
    runs-on: ubuntu-latest
    needs:
      - docker_build_and_push_job
    # Fail job if CRITICAL vulns found
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub (so Trivy can pull private image)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:${{ github.run_id }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
        # allow-failure: false is default; job fails if Trivy exits 1

  # -----------------------
  # Terraform static/security checks (tflint + tfsec)
  # -----------------------
  terraform_scan:
    name: terraform_scan
    runs-on: ubuntu-latest
    needs:
      - docker_build_and_push_job
    continue-on-error: true  # equivalent to allow_failure: true

    env:
      TF_DIR: "terraform"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tflint and tfsec
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl unzip bash ca-certificates coreutils

          # tflint
          curl -sL "https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip" -o /tmp/tflint.zip
          unzip /tmp/tflint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/tflint
          tflint --version

          # tfsec
          curl -sSL "https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh" | sudo bash
          tfsec --version

      - name: Run tflint and tfsec
        run: |
          set -e
          echo "Running tflint and tfsec against $TF_DIR"
          if [ ! -d "$GITHUB_WORKSPACE/$TF_DIR" ]; then
            echo "No terraform dir ($TF_DIR) found — skipping scans"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/$TF_DIR"

          # tflint (non-fatal because continue-on-error: true at job level)
          tflint || echo "tflint found issues"

          # tfsec (non-fatal)
          tfsec . || echo "tfsec found issues"

  # -----------------------
  # Terraform plan
  # -----------------------
  terraform_plan:
    name: terraform_plan
    runs-on: ubuntu-latest
    needs:
      - docker_build_and_push_job

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "${{ vars.AWS_REGION || 'ap-south-1' }}"
      TF_DIR: "terraform"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Write kubeconfig (if provided)
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$GITHUB_WORKSPACE/kubeconfig"
          echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig" >> "$GITHUB_ENV"

      - name: Terraform init and plan
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/terraform"
          terraform init -input=false -upgrade
          terraform plan -input=false -out=plan.tfplan -var "deploy_image=${{ env.DOCKER_IMAGE }}:${{ github.run_id }}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/plan.tfplan
          retention-days: 1

  # -----------------------
  # Terraform apply (manual)
  # -----------------------
  terraform_apply:
    name: terraform_apply
    runs-on: ubuntu-latest
    needs:
      - terraform_plan
    # Manual approval equivalent to GitLab's when: manual
    environment: production  # optional: use GitHub Environments for approvals

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "${{ vars.AWS_REGION || 'ap-south-1' }}"
      TERRAFORM_VERSION: "1.14.2"
      TF_DIR: "terraform"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v4.0.1"

      - name: Write kubeconfig (if provided)
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$GITHUB_WORKSPACE/kubeconfig"
          echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig" >> "$GITHUB_ENV"

      - name: Add EKS Helm repo
        run: |
          helm repo add eks https://aws.github.io/eks-charts || true
          helm repo update

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform init and apply
        run: |
          set -e
          echo "Listing terraform files for debug"
          ls -la "$GITHUB_WORKSPACE/$TF_DIR" || true
          cd "$GITHUB_WORKSPACE/$TF_DIR"
          terraform --version
          terraform init -input=false
          echo "Applying saved plan (plan.tfplan)..."
          terraform apply -input=false -auto-approve plan.tfplan
          terraform output load_balancer_hostname
